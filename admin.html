<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f5f0e7"><title>BIKCHU · Owner dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f0e7;--ink:#25251f;--muted:#77766c;--green:#b8d6a0;--line:#ded8ca;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif}.wrap{width:min(950px,calc(100% - 32px));margin:40px auto}.mono{font:11px "DM Mono";letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0}.panel,.request{background:var(--white);border:2px solid var(--ink);border-radius:9px;padding:22px;margin:18px 0;box-shadow:5px 5px 0 var(--line)}input{width:100%;padding:13px;border:1px solid #c9c3b6;border-radius:5px;font:inherit;margin:8px 0 12px}.btn{background:var(--ink);color:white;border:0;border-radius:5px;padding:11px 16px;font:800 14px Nunito;cursor:pointer;margin:5px 7px 5px 0}.btn:disabled{opacity:.5;cursor:wait}.muted{color:var(--muted);font-size:13px;line-height:1.6}.error{color:#a43d2f;font-weight:800}.request h3{margin:8px 0}.request pre{white-space:pre-wrap;font:14px/1.6 Nunito;background:#f5f0e7;padding:15px;border-radius:5px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill{background:#e6efd9;padding:5px 9px;border-radius:30px;font:11px "DM Mono"}.hidden{display:none}a{color:inherit}
</style></head>
<body><main class="wrap">
<div class="mono">BIKCHU APPS AND SERVICES / PRIVATE AREA</div><h1>Owner dashboard</h1><p class="muted">Review incoming project requests and generate an AI-assisted project brief. AI suggestions are drafts — check the scope and approve every quote yourself.</p>
<section class="panel" id="loginPanel"><h2>Owner login</h2><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter the ADMIN_PASSWORD you set in Vercel"><button class="btn" id="loginBtn">Unlock dashboard</button><p id="loginMessage" class="muted" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="row"><h2 style="margin-right:auto">Project requests</h2><button class="btn" id="refreshBtn">Refresh</button><button class="btn" id="logoutBtn">Log out</button></div><p class="muted" id="count"></p><div id="requests"></div></section>
</main>
<script>
let adminPassword = "";
const $ = id => document.getElementById(id);
async function api(path, options={}) {
  const response = await fetch(path, {...options, headers:{...(options.headers||{}), "Authorization":"Bearer "+adminPassword, "Content-Type":"application/json"}});
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}
function escapeHTML(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function loadRequests() {
  $("requests").innerHTML = '<p class="muted">Loading requests…</p>';
  try {
    const data = await api("/api/admin/requests");
    $("count").textContent = data.requests.length + " latest request(s)";
    if (!data.requests.length) { $("requests").innerHTML = '<div class="panel">No requests yet. New client requests will appear here.</div>'; return; }
    $("requests").innerHTML = data.requests.map(item => `
      <article class="request">
        <div class="row"><span class="pill">${escapeHTML(item.status)}</span><span class="mono">REF ${escapeHTML(item.id)}</span><span class="mono">${new Date(item.created_at).toLocaleString()}</span></div>
        <h3>${escapeHTML(item.name)} · ${escapeHTML(item.package)}</h3>
        <p><a href="mailto:${encodeURIComponent(item.email)}">${escapeHTML(item.email)}</a></p>
        <p>${escapeHTML(item.idea)}</p>
        <button class="btn" data-brief="${escapeHTML(item.id)}">Generate AI project brief</button>
        ${item.brief ? '<h3>Saved AI brief</h3><pre>'+escapeHTML(item.brief)+'</pre>' : ''}
        <div class="briefOutput" id="brief-${escapeHTML(item.id)}"></div>
      </article>`).join("");
    document.querySelectorAll("[data-brief]").forEach(button => button.addEventListener("click", async () => {
      const id = button.dataset.brief; button.disabled = true; button.textContent = "Thinking…";
      const output = $("brief-"+id); output.textContent = "Generating brief…";
      try { const result = await api("/api/admin/brief", {method:"POST", body:JSON.stringify({id})}); output.innerHTML = "<h3>AI-generated draft (review before sending)</h3><pre>"+escapeHTML(result.brief)+"</pre>"; }
      catch(error) { output.textContent = error.message; }
      finally { button.disabled = false; button.textContent = "Generate AI project brief"; }
    }));
  } catch(error) {
    $("requests").innerHTML = '<p class="error">'+escapeHTML(error.message)+'</p>';
    if (/password/i.test(error.message)) logout();
  }
}
function logout() { adminPassword=""; $("dashboard").classList.add("hidden"); $("loginPanel").classList.remove("hidden"); $("password").value=""; }
$("loginBtn").addEventListener("click", async () => {
  adminPassword = $("password").value;
  $("loginMessage").textContent = "Checking password…";
  try { await api("/api/admin/requests"); $("loginPanel").classList.add("hidden"); $("dashboard").classList.remove("hidden"); $("loginMessage").textContent=""; await loadRequests(); }
  catch(error) { adminPassword=""; $("loginMessage").textContent=error.message; }
});
$("password").addEventListener("keydown", event => { if(event.key==="Enter") $("loginBtn").click(); });
$("refreshBtn").addEventListener("click", loadRequests);
$("logoutBtn").addEventListener("click", logout);
</script></body></html>
